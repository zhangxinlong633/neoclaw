model:
  base_url: "http://127.0.0.1:9"
  name: "test"
  api_key: "x"
tools:
  enabled: true
  root: "."
  commands:
    - name: count_run
      description: "Append one line to tests/fixtures/count.out"
      argv: ["./tests/fixtures/bin/count.sh"]
      timeout_sec: 5
      max_output_bytes: 4096
      pass_args: stdin_json
workflows:
  - name: demo_loop
    description: "run count twice via loop"
    steps:
      - id: fetch
        type: tool
        tool: count_run
        args: {}
      - id: again
        type: loop
        over: ["fetch"]
        max: 2
        until: always
skills:
  directory: "skills"
memory:
  path: "MEMORY.md"
  max_chars: 100
session:
  max_turns: 2

# 演示 Neo 加载 example/ 下的 soul、bootstrap、rules、memory（在仓库根执行 neo）。
# 用法：./neo -c example/neo-claw-example.yaml "你是谁"
# 调试：./neo -c example/neo-claw-example.yaml -d "用一句话概括 example/SOUL.md 里对自称的要求"
#
# 路径均相对「当前工作目录」。请在 neoclaw 仓库根运行，勿省略 -c 或改 cwd，否则找不到 example/*.md。

model:
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  name: "qwen/qwen3-8b"
  api_key: "YOUR_OPENROUTER_API_KEY"
  max_tokens: 2048
  temperature: 0.7

workspace:
  prompt_cwd: true

soul:
  path: "example/SOUL.md"
  max_chars: 4000

bootstrap:
  max_chars_per_file: 4000
  - path: "example/AGENTS.md"

rules:
  max_chars_per_file: 3000
  - path: "example/RULES.md"

skills:
  directory: "skills"
  unmatched: index

memory:
  path: "example/MEMORY.md"
  max_chars: 2000

# 若需工具，可取消注释并保证 tools.root 与 cwd 一致（仓库根）
# tools:
#   enabled: true
#   root: "."
